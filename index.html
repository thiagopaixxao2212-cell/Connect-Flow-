const root=document.getElementById('root');
let session=JSON.parse(localStorage.getItem('cf_session')||'null');
let ctx={user:null,profile:null,clients:[],selected:null};
let currentView='overview';
let discovered={};
const $=id=>document.getElementById(id);
function toast(m,err=false){const t=$('toast');t.textContent=m;t.className='toast'+(err?' error':'');setTimeout(()=>t.classList.add('hidden'),3500)}
function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0))}
function num(v,d=0){return new Intl.NumberFormat('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d}).format(Number(v||0))}
function pct(v,d=1){return num(Number(v||0),d)+'%'}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateBR(s){if(!s)return '—';return new Date(s).toLocaleDateString('pt-BR')}
function monthKey(){return new Date().toISOString().slice(0,7)}
function monthRange(m=monthKey()){let [y,mo]=m.split('-').map(Number),start=`${m}-01`,end=new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10);return {start,end}}
function role(){return ctx.profile?.role||'client'}
function isOwner(){return role()==='owner'}
function isAdmin(){return ['owner','admin'].includes(role())}
function isStaff(){return ['owner','admin','analyst'].includes(role())}
function tokenExp(t){try{return JSON.parse(atob(t.split('.')[1])).exp*1000}catch{return 0}}
async function refreshSession(){if(!session?.refresh_token)return false;const r=await fetch(`${SUPA}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;session=await r.json();localStorage.setItem('cf_session',JSON.stringify(session));return true}
async function ensureSession(){if(!session?.access_token)return false;if(tokenExp(session.access_token)<Date.now()+60000){if(!(await refreshSession()))return false}return true}
async function api(path,opt={}){if(opt.auth!==false&&!(await ensureSession()))throw new Error('Sua sessão expirou. Entre novamente.');const h={apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})};if(opt.auth!==false&&session?.access_token)h.Authorization='Bearer '+session.access_token;let r;try{r=await fetch(SUPA+path,{...opt,headers:h})}catch(e){throw new Error('Não foi possível conectar ao servidor. Atualize a página e tente novamente.')}let d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||d?.msg||d?.error_description||d?.error||`Erro ${r.status}`);return d}
async function edge(name,body,auth=true){if(auth&&!(await ensureSession()))throw new Error('Sua sessão expirou.');const h={apikey:KEY,'Content-Type':'application/json'};if(auth)h.Authorization='Bearer '+session.access_token;const r=await fetch(`${SUPA}/functions/v1/${name}`,{method:'POST',headers:h,body:JSON.stringify(body||{})});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error||d?.message||`Erro ${r.status}`);return d}
function loading(){root.innerHTML='<div class="loading">Carregando ConnectFlow Digital...</div>'}

function authPage(mode='login',message=''){

uth-foot">O cliente não precisa de conta Vercel. O acesso é feito exclusivamente pelo login da ConnectFlow Digital.</div></div></section></main>`;
  $('tabLogin').onclick=()=>authPage('login');$('tabReg').onclick=()=>authPage('register');if($('forgotPass'))$('forgotPass').onclick=async()=>{try{const email=$('email').value.trim().toLowerCase();if(!email)throw new Error('Informe seu e-mail no campo acima.');const d=await edge('request-password-reset',{email},false);authPage('login',d?.message||'Solicitação registrada.')}catch(x){authPage('login','ERRO:'+x.message)}};
  $('authForm').onsubmit=async e=>{e.preventDefault();try{if(reg){const invite=$('invite').value.trim().toUpperCase();const d=await edge('client-register',{name:$('name').value.trim(),email:$('email').value.trim().toLowerCase(),password:$('pass').value,invite_code:invite},false);authPage('login',d?.message||'Conta criada. Você já pode entrar com e-mail e senha.')}else{session=await api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email:$('email').value,password:$('pass').value})});localStorage.setItem('cf_session',JSON.stringify(session));await boot()}}catch(x){authPage(reg?'register':'login','ERRO:'+x.message)}}
}
async function boot(){if(!session){authPage();return}loading();try{const u=await api('/auth/v1/user');const [p,clients]=await Promise.all([api(`/rest/v1/profiles?id=eq.${u.id}&select=full_name,role,avatar_url`),api('/rest/v1/clients?active=eq.true&select=id,name,slug,logo_url,contact_name,contact_email&order=name')]);ctx.user=u;ctx.profile=p[0]||{};ctx.clients=clients||[];const stored=localStorage.getItem('cf_client');ctx.selected=ctx.clients.find(c=>c.id===stored)||ctx.clients[0]||null;renderShell();await navigate(currentView)}catch(e){localStorage.removeItem('cf_session');session=null;authPage('login','ERRO:'+e.message)}}
function navItems(){let a=[['overview','◫','Visão geral'],['account','⚙','Minha conta'],['campaigns','◎','Campanhas'],['content','▦','Conteúdo'],['crm','◇','CRM & Leads'],['goals','⌖','Metas'],['diagnostics','⚑','Diagnósticos'],['reports','✦','Relatórios IA']];if(isAdmin()){a.splice(1,0,['clients','◉','Clientes'],['access','⌁','Acessos']);if(isOwner())a.splice(3,0,['team','♟','Equipe']);a.push(['integrations','↻','Integrações'])}return a}
function renderShell(){root.innerHTML=`<div class="app-shell"><aside class="sidebar" id="sidebar"><div class="side-logo-wrap"><img src="${LOGO}" class="side-logo" alt="ConnectFlow Digital"></div><div class="side-caption">Performance Hub</div><nav class="nav" id="nav">${navItems().map(([v,i,l])=>`<button data-v="${v}" class="${v===currentView?'active':''}"><span class="ico">${i}</span>${l}</button>`).join('')}</nav><div class="side-bottom"><div class="user-chip"><div class="avatar">${esc((ctx.profile.full_name||ctx.user.email||'U')[0].toUpperCase())}</div><div><b>${esc(ctx.profile.full_name||ctx.user.email)}</b><span>${role()}</span></div></div><button class="logout" id="logout">Sair</button></div></aside><main class="workspace"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn btn-ghost mobile-menu" id="menuBtn">☰</button><div class="title-wrap"><h1>ConnectFlow Digital</h1><p id="crumb">Central de performance e relacionamento</p></div></div><div class="top-actions">${ctx.clients.length?`<select id="clientSelect" class="client-select" ${!isStaff()?'disabled':''}>${ctx.clients.map(c=>`<option value="${c.id}" ${ctx.selected?.id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:''}<span class="sync-status">● Sistema online</span></div></header><section class="content" id="view"></section></main></div>`;
  $('nav').onclick=e=>{const b=e.target.closest('button[data-v]');if(b)navigate(b.dataset.v)};$('logout').onclick=()=>{localStorage.removeItem('cf_session');localStorage.removeItem('cf_client');session=null;ctx={user:null,profile:null,clients:[],selected:null};authPage()};if($('clientSelect'))$('clientSelect').onchange=async e=>{ctx.selected=ctx.clients.find(c=>c.id===e.target.value);localStorage.setItem('cf_client',ctx.selected.id);await navigate(currentView)};if($('menuBtn'))$('menuBtn').onclick=()=> $('sidebar').classList.toggle('open')
}
async function navigate(v){if(!navItems().some(x=>x[0]===v))v='overview';currentView=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));if($('sidebar'))$('sidebar').classList.remove('open');const view=$('view');view.innerHTML='<div class="loading">Carregando dados...</div>';try{if(v==='overview')await viewOverview();if(v==='account')await viewAccount();if(v==='clients')await viewClients();if(v==='access')await viewAccess();if(v==='team')await viewTeam();if(v==='campaigns')await viewCampaigns();if(v==='content')await viewContent();if(v==='crm')await viewCRM();if(v==='goals')await viewGoals();if(v==='diagnostics')await viewDiagnostics();if(v==='reports')await viewReports();if(v==='integrations')await viewIntegrations()}catch(e){view.innerHTML=`<div class="panel"><div class="notice error">${esc(e.message)}</div></div>`}}
function needClient(){if(!ctx.selected)throw new Error('Nenhum cliente selecionado. Cadastre ou vincule um cliente primeiro.');return ctx.selected}
function kpi(label,value,icon,sub=''){return `<div class="kpi"><div class="kpi-top"><span class="kpi-label">${label}</span><span class="kpi-icon">${icon}</span></div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></div>`}
async function clientData(){const c=needClient(),{start,end}=monthRange();const [m,accounts,posts,leads]=await Promise.all([api(`/rest/v1/daily_metrics?entity_level=eq.account&metric_date=gte.${start}&metric_date=lte.${end}&ad_accounts.client_id=eq.${c.id}&select=metric_date,spend,impressions,reach,frequency,clicks,link_clicks,ctr,cpc,cpm,leads,purchases,conversions,conversion_value,roas,ad_accounts!inner(client_id)`),api(`/rest/v1/ad_accounts?client_id=eq.${c.id}&active=eq.true&select=id,name,platform,currency,last_synced_at`),api(`/rest/v1/social_posts?client_id=eq.${c.id}&published_at=gte.${start}T00:00:00Z&published_at=lte.${end}T23:59:59Z&select=id,platform,content_type,published_at,impressions,reach,engagements`),api(`/rest/v1/crm_leads?client_id=eq.${c.id}&created_at=gte.${start}T00:00:00Z&created_at=lte.${end}T23:59:59Z&select=id,status,qualified,deal_value,created_at`)]);return {m,accounts,posts,leads,start,end}}
function aggregate(rows){let a={spend:0,impressions:0,reach:0,clicks:0,link_clicks:0,leads:0,purchases:0,conversions:0,conversion_value:0,frequency:0,ctr:0,cpc:0,cpm:0,roas:0};rows.forEach(r=>{['spend','impressions','reach','clicks','link_clicks','leads','purchases','conversions','conversion_value'].forEach(k=>a[k]+=Number(r[k]||0))});a.ctr=a.impressions?100*a.clicks/a.impressions:0;a.cpc=a.clicks?a.spend/a.clicks:0;a.cpm=a.impressions?a.spend/a.impressions*1000:0;a.roas=a.spend?a.conversion_value/a.spend:0;return a}
async function viewOverview(){const c=needClient(),d=await clientData(),a=aggregate(d.m);const today=new Date().toISOString().slice(0,10),postsToday=d.posts.filter(p=>String(p.published_at||'').slice(0,10)===today).length,qualified=d.leads.filter(l=>l.qualified||['qualified','whatsapp','contacted','proposal','won'].includes(l.status)).length,won=d.leads.filter(l=>l.status==='won').length,lost=d.leads.filter(l=>l.status==='lost').length,wpp=d.leads.filter(l=>['whatsapp','contacted','proposal','won','lost'].includes(l.status)).length;const daily={};d.m.forEach(r=>daily[r.metric_date]=(daily[r.metric_date]||0)+Number(r.spend||0));let vals=Object.values(daily);if(!vals.length)vals=[0,0,0,0,0,0,0];const max=Math.max(...vals,1);$('crumb').textContent=`${c.name} • visão consolidada`;$('view').innerHTML=`<div class="page-head"><div><h2>${esc(c.name)}</h2><p>Acompanhamento do mês atual: Ads, conteúdo e CRM em uma única visão.</p></div><div class="actions">${isStaff()?`<button class="btn btn-secondary" id="quickSync">Sincronizar Ads</button>`:''}<button class="btn btn-ghost" onclick="navigate('reports')">Relatório mensal</button></div></div><div class="grid-kpi">${kpi('Investimento',money(a.spend),'R$','Meta Ads no mês')}${kpi('Leads Ads',num(a.leads,0),'↗',a.spend&&a.leads?`CPL ${money(a.spend/a.leads)}`:'Sem CPL ainda')}${kpi('CTR',pct(a.ctr,2),'%','Taxa de cliques')}${kpi('Leads qualificados',num(qualified),'✓',`${wpp} avançaram para WhatsApp/funil`)}${kpi('Vendas fechadas',num(won),'★',`${lost} perdidos no período`)}${kpi('Postagens hoje',num(postsToday),'▦',`${d.posts.length} publicações no mês`)}</div><div class="layout-2"><div class="panel"><div class="panel-head"><div><h3>Investimento diário</h3><p>Evolução do gasto no mês</p></div><span class="badge b-blue">${money(a.spend)}</span></div><div class="chart">${vals.map(v=>`<div class="bar" title="${money(v)}" style="height:${Math.max(4,(v/max)*100)}%"></div>`).join('')}</div><div class="chart-labels"><span>Início</span><span>Hoje</span></div></div><div class="panel"><div class="panel-head"><div><h3>Plataformas ativas</h3><p>Onde os anúncios estão rodando</p></div></div><div class="platforms">${d.accounts.length?d.accounts.map(x=>`<span class="platform"><i class="status-dot"></i>${esc(String(x.platform).toUpperCase())} · ${esc(x.name)}</span>`).join(''):'<div class="empty">Nenhuma conta de anúncios conectada ainda.</div>'}</div><div style="height:14px"></div><div class="panel-head"><div><h3>Funil comercial</h3><p>Do lead à venda</p></div></div><div class="funnel"><div class="funnel-step"><strong>${d.leads.length}</strong><span>LEADS CRM</span></div><div class="funnel-step"><strong>${qualified}</strong><span>QUALIFICADOS</span></div><div class="funnel-step"><strong>${wpp}</strong><span>WHATSAPP</span></div><div class="funnel-step"><strong>${won}</strong><span>FECHADOS</span></div><div class="funnel-step"><strong>${lost}</strong><span>PERDIDOS</span></div></div></div></div><div class="layout-3">${kpi('Impressões',num(a.impressions,0),'◉','Entrega dos anúncios')}${kpi('Alcance',num(a.reach,0),'◎','Pessoas alcançadas')}${kpi('ROAS',a.roas?num(a.roas,2)+'x':'—','↗',a.conversion_value?`Valor ${money(a.conversion_value)}`:'Quando houver valor de conversão')}</div>`;if($('quickSync'))$('quickSync').onclick=async()=>{try{if(!d.accounts.length)throw new Error('Conecte uma conta Meta Ads em Integrações.');$('quickSync').textContent='Sincronizando...';for(const ac of d.accounts)await edge('meta-sync',{ad_account_id:ac.id});toast('Dados da Meta atualizados.');await viewOverview()}catch(e){toast(e.message,true)}}}

s.length,'◇','Entradas no mês')}${kpi('Qualificados',q,'✓',leads.length?`${num(q/leads.length*100,1)}% dos leads`:'—')}${kpi('Foram ao WhatsApp',w,'↗','Avanço comercial')}${kpi('Fechados',won,'★',q?`${num(won/q*100,1)}% dos qualificados`:'—')}${kpi('Perdidos',lost,'×','Oportunidades perdidas')}${kpi('Receita fechada',money(revenue),'R$','Valor registrado no CRM')}</div><div class="panel" style="margin-top:13px"><div class="panel-head"><div><h3>Pipeline de leads</h3><p>Atualize o status conforme o atendimento avança</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Lead</th><th>Origem</th><th>Status</th><th>WhatsApp</th><th>Entrada</th><th class="num">Valor</th></tr></thead><tbody>${leads.length?leads.map(l=>`<tr><td><div class="row-title">${esc(l.name||'Lead sem nome')}</div><div class="muted">${esc(l.email||'')}</div></td><td>${esc(l.source_platform||'—')}</td><td>${isStaff()?`<select class="leadStatusEdit" data-id="${l.id}" data-old="${l.status}"><option value="new" ${l.status==='new'?'selected':''}>Novo</option><option value="qualified" ${l.status==='qualified'?'selected':''}>Qualificado</option><option value="whatsapp" ${l.status==='whatsapp'?'selected':''}>WhatsApp</option><option value="contacted" ${l.status==='contacted'?'selected':''}>Contatado</option><option value="proposal" ${l.status==='proposal'?'selected':''}>Proposta</option><option value="won" ${l.status==='won'?'selected':''}>Fechado</option><option value="lost" ${l.status==='lost'?'selected':''}>Perdido</option></select>`:`<span class="badge ${l.status==='won'?'b-green':l.status==='lost'?'b-red':'b-blue'}">${esc(l.status)}</span>`}</td><td>${esc(l.phone||'—')}</td><td>${dateBR(l.created_at)}</td><td class="num">${money(l.deal_value||0)}</td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">Nenhum lead registrado neste mês.</div></td></tr>'}</tbody></table></div></div>`;if($('toggleLead')){$('toggleLead').onclick=()=> $('leadBox').classList.toggle('hidden');$('leadFor async function viewGoals(){
  const c=needClient(); $('crumb').textContent=`${c.name} • metas`;
  const [goals,d]=await Promise.all([api(`/rest/v1/client_goals?client_id=eq.${c.id}&active=eq.true&select=*&order=created_at.desc`),clientData()]);
  const a=aggregate(d.m), current={spend:a.spend,leads:a.leads,cpl:a.leads?a.spend/a.leads:0,ctr:a.ctr,cpc:a.cpc,cpm:a.cpm,roas:a.roas,conversions:a.conversions};
  function goalStatus(g){const v=Number(current[g.metric_key]||0),t=Number(g.target_value||0);let ok=false;if(g.comparison==='lte')ok=v<=t;else if(g.comparison==='gte')ok=v>=t;else if(g.comparison==='between')ok=v>=Number(g.target_min||0)&&v<=Number(g.target_max||0);return {v,ok}}

  if($('toggleGoal')){$('toggleGoal').onclick=()=> $('goalBox').classList.toggle('hidden');$('goalForm').onsubmit=async e=>{e.preventDefault();try{await api('/rest/v1/client_goals',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({client_id:c.id,name:$('goalName').value,metric_key:$('goalMetric').value,comparison:$('goalComp').value,target_value:Number($('goalValue').value),active:true})});toast('Meta cadastrada.');await viewGoals()}catch(e){toast(e.message,true)}}}
}
async function viewDiagnostics(){
  const c=needClient(); $('crumb').textContent=`${c.name} • diagnósticos`;
  const [saved,d,goals]=await Promise.all([api(`/rest/v1/diagnostics?client_id=eq.${c.id}&resolved=eq.false&select=*&order=created_at.desc&limit=30`),clientData(),api(`/rest/v1/client_goals?client_id=eq.${c.id}&active=eq.true&select=*`)]);
  const a=aggregate(d.m), live=[];
  if(a.impressions>0&&a.ctr<1) live.push({status:'critical',title:'CTR baixo',message:`CTR atual de ${pct(a.ctr,2)}. O criativo ou público pode precisar de revisão.`});
  if(a.frequency>=4) live.push({status:'attention',title:'Frequência elevada',message:`Frequência estimada em ${num(a.frequency,2)}. Avalie saturação de público.`});
  if(a.spend>0&&a.leads===0) live.push({status:'critical',title:'Investimento sem leads',message:`Há ${money(a.spend)} investidos no mês sem leads registrados na mídia.`});
  goals.forEach(g=>{let v=g.metric_key==='cpl'?(a.leads?a.spend/a.leads:0):Number(a[g.metric_key]||0),t=Number(g.target_value||0),ok=g.comparison==='lte'?v<=t:v>=t;if(!ok)live.push({status:'attention',title:`Meta fora do alvo: ${g.name}`,message:`Resultado atual ${num(v,2)} versus alvo ${num(t,2)}.`})});
  if(!live.length&&d.m.length) live.push({status:'healthy',title:'Operação sem alertas críticos',message:'Os indicadores acompanhados não dispararam alertas automáticos neste período.'});
  const rows=[...live,...saved.map(x=>({status:x.status,title:x.title,message:x.message}))];
  const badge=s=>s==='critical'?'b-red':s==='attention'?'b-orange':s==='healthy'?'b-green':'b-gray';
  $('view').innerHTML=`<div class="page-head"><div><h2>Diagnósticos</h2><p>Leitura automática de performance, metas e sinais que exigem ação.</p></div><button class="btn btn-secondary" id="refreshDiag">Atualizar diagnóstico</button></div><div class="layout-2"><div class="panel"><div class="panel-head"><div><h3>Alertas atuais</h3><p>Análise em tempo real do mês</p></div><span class="badge b-blue">${rows.length} sinal(is)</span></div>${rows.length?rows.map(r=>`<div class="alert" style="margin-top:10px"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(r.title)}</b><span class="badge ${badge(r.status)}">${esc(r.status)}</span></div><div class="muted" style="margin-top:6px;line-height:1.5">${esc(r.message)}</div></div>`).join(''):'<div class="empty">Ainda não há dados suficientes para gerar diagnóstico.</div>'}</div><div class="panel"><div class="panel-head"><div><h3>Resumo do mês</h3><p>Indicadores usados na análise</p></div></div><div class="funnel" style="grid-template-columns:repeat(2,1fr)"><div class="funnel-step"><strong>${money(a.spend)}</strong><span>INVESTIMENTO</span></div><div class="funnel-step"><strong>${num(a.leads)}</strong><span>LEADS</span></div><div class="funnel-step"><strong>${pct(a.ctr,2)}</strong><span>CTR</span></div><div class="funnel-step"><strong>${a.leads?money(a.spend/a.leads):'—'}</strong><span>CPL</span></div></div></div></div>`;
  $('refreshDiag').onclick=()=>viewDiagnostics();
}
